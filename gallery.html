<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo Gallery — Samarth Kulkarni</title>
<meta name="description" content="Travel photography by Samarth Kulkarni." />
<style>
  :root{
    --bg:#000;--bg-2:#0a0a0a;--hairline:rgba(255,255,255,0.10);
    --text:#f5f5f7;--text-dim:#a1a1a6;--muted:#86868b;--dimmer:#5c6680;--blue:#2997ff;--blue-hover:#0071e3;
    --maxw:1180px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;background:#000}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.47;font-size:17px;letter-spacing:-0.022em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
  ::selection{background:var(--blue);color:#fff}
  a{color:var(--blue);text-decoration:none}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;height:48px;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(255,255,255,0.08)}
  .nav-inner{width:100%;max-width:1024px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
  .logo{font-size:1.05rem;font-weight:600;color:var(--text);letter-spacing:-0.02em}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--text);font-size:.86rem;font-weight:400;opacity:.85}
  .back:hover{opacity:1;text-decoration:none}

  header{max-width:var(--maxw);margin:0 auto;padding:140px 22px 50px;text-align:center}
  .eyebrow{font-size:1.05rem;font-weight:600;color:var(--blue);margin-bottom:16px}
  h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:700;letter-spacing:-0.05em;line-height:1.02;margin-bottom:20px}
  .gradient-text{background:linear-gradient(180deg,#f5f5f7 30%,#86868b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:clamp(1.1rem,2vw,1.4rem);color:var(--text-dim);max-width:640px;margin:0 auto;font-weight:400;letter-spacing:-0.015em}

  .gallery{max-width:var(--maxw);margin:0 auto;padding:20px 22px 120px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .photo{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;
    background:linear-gradient(135deg,#141416,#0a0a0c);border:1px solid var(--hairline)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;transition:transform .55s cubic-bezier(.2,.7,.3,1)}
  .photo:hover img{transform:scale(1.06)}
  .photo .ph-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dimmer);font-size:.78rem;text-align:center;padding:16px}
  .photo .ph-fallback svg{width:30px;height:30px;opacity:.5}
  .photo .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;z-index:2;
    background:linear-gradient(transparent,rgba(0,0,0,0.78));color:#fff;font-size:.9rem;font-weight:500;
    opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
  .photo:hover .cap{opacity:1;transform:none}

  .lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,0.6)}
  .lightbox .lb-close{position:absolute;top:22px;right:26px;background:none;border:none;color:#fff;cursor:pointer;padding:8px;opacity:.8}
  .lightbox .lb-close:hover{opacity:1}
  .lightbox .lb-close svg{width:26px;height:26px}

  footer{border-top:1px solid var(--hairline);padding:30px 22px;font-size:.78rem;color:var(--muted);text-align:center;max-width:var(--maxw);margin:0 auto}
  footer a{color:var(--muted)}footer a:hover{color:var(--text)}

  @media(max-width:780px){.gallery{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">Samarth Kulkarni</div>
    <a href="index.html" class="back"><svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 4L6 9l5 5"/></svg> Back to portfolio</a>
  </div>
</nav>

<header>
  <p class="eyebrow">Beyond Code</p>
  <h1><span class="gradient-text">Through the lens.</span></h1>
  <p class="sub">A collection of frames from my travels — including a recent trip to the UAE.</p>
</header>

<main class="gallery" id="gallery"></main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <img id="lightboxImg" src="" alt="Enlarged photo">
</div>

<footer>
  © <span id="yr"></span> Samarth Kulkarni · <a href="index.html">Back to portfolio</a>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  /* ============================================================
     TO ADD PHOTOS: drop image files in the /photos folder, then
     add a line below. That's it — the gallery renders automatically.
     ============================================================ */
  const photos = [
    { src: "photos/1.jpg",  cap: "Burj Khalifa · Dubai" },
    { src: "photos/2.jpg",  cap: "Downtown Dubai at night" },
    { src: "photos/3.jpg",  cap: "Palm Jumeirah, from the top" },
    // Add more photos here as you take them — drop the file in /photos and add a line:
    // { src: "photos/4.jpg",  cap: "Your caption here" },
    // { src: "photos/5.jpg",  cap: "Your caption here" },
  ];

  const cameraSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/></svg>';
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = photos.map(p => `
    <div class="photo" data-src="${p.src}">
      <div class="ph-fallback">${cameraSvg}${p.src}</div>
      <img src="${p.src}" alt="${p.cap}" loading="lazy" onerror="this.style.display='none'">
      <div class="cap">${p.cap}</div>
    </div>`).join('');

  // Lightbox
  const lightbox = document.getElementById('lightbox'), lightboxImg = document.getElementById('lightboxImg');
  gallery.querySelectorAll('.photo').forEach(p => {
    p.addEventListener('click', () => {
      const img = p.querySelector('img');
      if (img && img.complete && img.naturalWidth > 0) {
        lightboxImg.src = img.src;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
    });
  });
  function closeLightbox(){ lightbox.classList.remove('open'); lightboxImg.src = ''; document.body.style.overflow = ''; }
  lightbox.addEventListener('click', closeLightbox);
  addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
